# Optional project rules. Apply outside the agent session at
# .symbiont/local-policy.toml. Python 3.11+ parses standard TOML.
[mode]
mode = "balanced"

[deny]
# Paths use glob and substring matching; both reads and writes are checked.
paths = [
    "private/",
    "*.backup",
]
# Command patterns are substrings. These do not interpret shell effects.
commands = ["forbidden-command"]
branches = ["main", "production"]

[allow]
# Exceptions relax built-ins only; local denies and control paths still win.
paths = [".env.template"]
# Whole-command exceptions, never substring exemptions.
commands = ["sudo systemctl status myapp"]
